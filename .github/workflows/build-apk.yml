name: 打包 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 打包
        run: gradle assembleDebug --no-daemon

      - name: 保存安裝檔
        uses: actions/upload-artifact@v4
        with:
          name: SeniorDict-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 發布到「Releases」（手機上比較好下載）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SeniorDict.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SeniorDict.apk --title "大字國語辭典（最新版）" --notes "最新打包的安裝檔 SeniorDict.apk"
